<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arachnophobia</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    /* black from the very first paint until the level is built and its shaders compiled (menu.js lifts it) */
    #veil { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font: 600 30px ui-monospace, Consolas, monospace; letter-spacing: 0.32em; color: #e8e0dc; }
    #veil .l { margin-top: 16px; font: 11px ui-monospace, Consolas, monospace; letter-spacing: 0.3em; color: #6f6763; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .shot #veil { display: none; }
  </style>
</head>
<body>
  <div id="veil">ARACHNOPHOBIA<div class="l">ENTERING THE FACILITY</div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
